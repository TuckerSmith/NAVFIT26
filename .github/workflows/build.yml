name: Build and Release
on:
  push:
    tags:
      - 'v*' # Triggers when you push a tag (e.g., git tag v1.0.0)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # REQUIRED to upload the .deb to Releases
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3 libsqlite3-dev

      - name: Build UI and Package Linux Assets
        run: |
          npm run build-ui
          # Build both deb and AppImage at the same time
          npx electron-builder --linux deb AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          # This pattern will now catch both .deb and .AppImage
          files: |
            dist/*.deb
            dist/*.AppImage
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}